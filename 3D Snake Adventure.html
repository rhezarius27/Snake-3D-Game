<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Snake Adventure</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#bfe9ff;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#fff}
.ov.on{display:flex}
h1{font-size:clamp(34px,8vw,64px);margin:0;color:#fff;text-shadow:0 4px 0 #e8590c,0 8px 18px rgba(0,0,0,.35);letter-spacing:1px}
h2{margin:0;font-size:32px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn{border:0;border-radius:999px;padding:13px 34px;font:700 20px inherit;font-family:inherit;color:#fff;background:linear-gradient(#ff9f43,#ee5a24);box-shadow:0 5px 0 #b33d12,0 10px 18px rgba(0,0,0,.25);cursor:pointer;min-width:230px;transition:transform .12s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:translateY(3px)}
.btn.g{background:linear-gradient(#55e6a5,#10ac84);box-shadow:0 5px 0 #0a7a5c,0 10px 18px rgba(0,0,0,.25)}
.btn.b{background:linear-gradient(#74b9ff,#0984e3);box-shadow:0 5px 0 #065aa3,0 10px 18px rgba(0,0,0,.25)}
.panel{background:rgba(20,30,60,.72);backdrop-filter:blur(8px);border-radius:24px;padding:16px 20px;max-width:92vw}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff8;cursor:pointer}
.sw.sel{border-color:#fff;transform:scale(1.18)}
.tg{border:2px solid #fff8;background:#0003;color:#fff;border-radius:999px;padding:7px 16px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.tg.on{background:#10ac84;border-color:#fff}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:none;justify-content:space-between;padding:0 14px;color:#fff;font-weight:700;font-size:20px;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
#hud.on{display:flex}
#hud span{background:rgba(20,30,60,.6);padding:6px 14px;border-radius:999px}
#pb{pointer-events:auto;cursor:pointer}
#dp{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
#dp button{border:0;border-radius:16px;background:rgba(20,30,60,.55);color:#fff;font-size:24px}
@media (pointer:coarse){#dp.on{display:grid}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:22px;text-shadow:0 2px 6px #000a;opacity:0;transition:opacity .3s;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">Skor 0</span><span id="bs">Terbaik 0</span><span id="co">🪙 0</span><span id="pb">⏸</span></div>
<div id="toast"></div>
<div id="dp"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div>

<div class="ov on" id="menu"><h1>🐍 3D Snake<br>Adventure</h1>
<button class="btn" id="bPlay">PLAY GAME</button>
<button class="btn g" id="bCust">CUSTOMIZE SNAKE</button>
<button class="btn b" id="bMute">🔊 SUARA: ON</button>
<div class="panel" style="font-size:15px">WASD / Panah / Swipe • 🪙 <b id="mc">0</b> • Terbaik <b id="mb">0</b></div></div>

<div class="ov" id="cust" style="justify-content:flex-end;padding-bottom:24px"><div class="panel">
<h2>Customize Snake</h2><p style="margin:6px 0">Warna</p><div class="row" id="sws"></div>
<p style="margin:10px 0 6px">Aksesoris</p><div class="row" id="acc"></div>
<div style="margin-top:12px;display:flex;gap:10px;justify-content:center"><button class="tg" id="bRnd">🎲 Randomize</button><button class="tg" id="bRst">Reset</button><button class="tg on" id="bBack">Simpan &amp; Kembali</button></div></div></div>

<div class="ov" id="over" style="background:rgba(10,15,40,.55)"><h1 style="font-size:clamp(30px,7vw,52px)">GAME OVER</h1>
<div class="panel" style="font-size:20px;line-height:1.6">Skor <b id="fs">0</b> • Terbaik <b id="fb">0</b><br>Panjang <b id="fl">0</b> • Buah <b id="ff">0</b><br>Koin didapat <b id="fc">0</b> • Waktu <b id="ft">0</b>s</div>
<button class="btn" id="bAgain">PLAY AGAIN</button><button class="btn b" id="bMenu">MAIN MENU</button><button class="btn g" id="bShare">SHARE SCORE</button></div>

<div class="ov" id="pause" style="background:rgba(10,15,40,.55)"><h2>PAUSE</h2><button class="btn" id="bRes">LANJUT</button><button class="btn b" id="bQuit">MAIN MENU</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), N=20;
let S={best:0,coins:0,games:0,color:'#2ecc71',acc:{hat:false,crown:false,glasses:true},mute:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('snake3d')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('snake3d',JSON.stringify(S))}catch(e){}};
// audio
let AC;function beep(f,d=.1,t='sine',v=.15){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// scene
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const sc=new THREE.Scene();sc.background=new THREE.Color(0xbfe9ff);sc.fog=new THREE.Fog(0xbfe9ff,30,60);
const cam=new THREE.PerspectiveCamera(50,1,.1,100);
sc.add(new THREE.HemisphereLight(0xffffff,0x6ab04c,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(8,18,6);sun.castShadow=true;sun.shadow.camera.left=-14;sun.shadow.camera.right=14;sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;sc.add(sun);
for(let x=0;x<N;x++)for(let z=0;z<N;z++){const t=new THREE.Mesh(new THREE.BoxGeometry(1,.4,1),new THREE.MeshLambertMaterial({color:(x+z)%2?0x7ed957:0x6cc64a}));t.position.set(x-N/2+.5,-.2,z-N/2+.5);t.receiveShadow=true;sc.add(t)}
const wm=new THREE.MeshLambertMaterial({color:0x8d6e63});
[[N+1,.8,1,0,-N/2-.5],[N+1,.8,1,0,N/2+.5],[1,.8,N+1,-N/2-.5,0],[1,.8,N+1,N/2+.5,0]].forEach(w=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w[0],w[1],w[2]),wm);m.position.set(w[3],.3,w[4]);sc.add(m)});
for(let i=0;i<14;i++){const a=i/14*6.28,r=17+Math.random()*4,t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,1.6,8),wm),lf=new THREE.Mesh(new THREE.SphereGeometry(1.4,10,8),new THREE.MeshLambertMaterial({color:0x2ecc71}));lf.position.y=1.8;t.add(tr,lf);t.position.set(Math.cos(a)*r,.8,Math.sin(a)*r);sc.add(t)}
const cell=(x,z)=>new THREE.Vector3(x-N/2+.5,.5,z-N/2+.5);
// snake
const COLORS=['#e74c3c','#ff9f43','#f1c40f','#2ecc71','#3498db','#4b0082','#8e44ad','#ff77c8','#9b59b6','#222222','#ffffff','#ffd700','#c0c0c0','#00e5ff','rainbow'];
const sphG=new THREE.SphereGeometry(.5,16,12);
let segs=[],cells=[],dir=[1,0],q=[],grow=0,fruit=null,score=0,eaten=0,coinsRun=0,tickMs=150,acc=0,state='menu',t0=0,startT=0,angle=0,tongue,accG={};
function col(i,n){const c=new THREE.Color();if(S.color==='rainbow')c.setHSL((i/Math.max(n,6))%1,.85,.55);else c.set(S.color);return c}
function mkHead(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.SphereGeometry(.62,20,16),new THREE.MeshStandardMaterial({roughness:.5}));m.castShadow=true;g.skin=m;g.add(m);
[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));e.position.set(.4,.3,s*.3);const p=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),new THREE.MeshBasicMaterial({color:0}));p.position.set(.12,0,0);e.add(p);g.add(e)});
tongue=new THREE.Mesh(new THREE.BoxGeometry(.4,.04,.08),new THREE.MeshBasicMaterial({color:0xff3b5c}));tongue.position.set(.8,-.1,0);g.add(tongue);
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const hat=new THREE.Group();const cone=new THREE.Mesh(new THREE.ConeGeometry(.35,.7,12),mat(0xff4d6d));cone.position.y=.95;hat.add(cone);const br=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.06,16),mat(0xffd166));br.position.y=.62;hat.add(br);
const crown=new THREE.Group();const cb=new THREE.Mesh(new THREE.CylinderGeometry(.38,.34,.28,12),mat(0xffd700));cb.position.y=.7;crown.add(cb);for(let i=0;i<5;i++){const a=i/5*6.28,sp=new THREE.Mesh(new THREE.ConeGeometry(.08,.22,6),mat(0xffd700));sp.position.set(Math.cos(a)*.34,.95,Math.sin(a)*.34);crown.add(sp)}
const gl=new THREE.Group();[-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.16,.035,8,16),mat(0x111111));r.position.set(.5,.3,s*.3);r.rotation.y=Math.PI/2;gl.add(r)});const bg=new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.2),mat(0x111111));bg.position.set(.55,.32,0);gl.add(bg);
accG={hat,crown,glasses:gl};Object.values(accG).forEach(a=>g.add(a));return g}
function applyAcc(){for(const k in accG)accG[k].visible=!!S.acc[k]}
function recolor(){segs.forEach((s,i)=>{const c=col(i,segs.length);(i?s:s.skin).material.color.copy(c)})}
function sync(){while(segs.length<cells.length){let m;if(!segs.length){m=mkHead();applyAcc()}else{m=new THREE.Mesh(sphG,new THREE.MeshStandardMaterial({roughness:.5}));m.castShadow=true}
const p=cells[segs.length];m.position.copy(cell(p[0],p[1]));sc.add(m);segs.push(m)}
while(segs.length>cells.length)sc.remove(segs.pop());
segs.forEach((s,i)=>{if(i){const k=1-.5*(i/segs.length);s.userData.k=.9*k}});recolor()}
// fruits
const FR=[['Apel',10,0xe53935,[1,1,1]],['Pisang',15,0xffe135,[1.6,.5,.5]],['Jeruk',20,0xff9800,[1,1,1]],['Stroberi',25,0xff3366,[.8,1.1,.8]],['Anggur',30,0x7b1fa2,[.8,.8,.8]],['Semangka',40,0x2e8b3d,[1.3,1,1]],['Nanas',50,0xfbc02d,[.9,1.4,.9]],['Golden Apple',100,0xffd700,[1.1,1.1,1.1]]];
function spawn(){const free=[];for(let x=0;x<N;x++)for(let z=0;z<N;z++)if(!cells.some(c=>c[0]===x&&c[1]===z))free.push([x,z]);if(!free.length)return;
const p=free[Math.random()*free.length|0];let r=Math.random(),i=r<.05?7:r<.4?0:(Math.random()*6+1|0);if(fruit)sc.remove(fruit.m);
const f=FR[i],m=new THREE.Mesh(sphG,new THREE.MeshStandardMaterial({color:f[2],roughness:.3,emissive:i===7?0x886600:0}));m.scale.set(...f[3]);m.scale.multiplyScalar(.7);m.castShadow=true;m.position.copy(cell(p[0],p[1]));sc.add(m);
fruit={x:p[0],z:p[1],m,pts:f[1],name:f[0],exp:i===7?performance.now()+8000:0}}
const parts=[];function burst(pos,c){for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.08,6,4),new THREE.MeshBasicMaterial({color:c}));m.position.copy(pos);m.userData={v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5),l:.6};sc.add(m);parts.push(m)}}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,900)}
// game flow
function setCells(a){cells=a;sync()}
function demo(){state='menu';if(fruit){sc.remove(fruit.m);fruit=null}const a=[];for(let i=0;i<8;i++)a.push([10-i,10]);setCells(a);segs.forEach((s,i)=>s.position.copy(cell(10-i,10)));dir=[1,0]}
function start(){state='play';cells=[[10,10],[9,10],[8,10]];dir=[1,0];q=[];grow=0;score=eaten=coinsRun=0;tickMs=150;acc=0;startT=performance.now();sync();segs.forEach((s,i)=>s.position.copy(cell(cells[i][0],cells[i][1])));if(fruit){sc.remove(fruit.m);fruit=null}spawn();S.games++;show(null);$('hud').classList.add('on');$('dp').classList.add('on');hud()}
function hud(){$('sc').textContent='Skor '+score;$('bs').textContent='Terbaik '+Math.max(S.best,score);$('co').textContent='🪙 '+coinsRun}
function show(id){['menu','cust','over','pause'].forEach(k=>$(k).classList.toggle('on',k===id));if(id==='menu'){$('mc').textContent=S.coins;$('mb').textContent=S.best}$('hud').classList.toggle('on',!id||id==='pause');$('dp').classList.toggle('on',!id)}
function over(){state='over';beep(150,.5,'sawtooth');S.best=Math.max(S.best,score);S.coins+=coinsRun;save();
$('fs').textContent=score;$('fb').textContent=S.best;$('fl').textContent=cells.length;$('ff').textContent=eaten;$('fc').textContent=coinsRun;$('ft').textContent=((performance.now()-startT)/1000|0);setTimeout(()=>{if(state==='over')show('over')},700)}
function turn(d){const m={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[d],l=q.length?q[q.length-1]:dir;if(m[0]+l[0]===0&&m[1]+l[1]===0)return;if(m[0]===l[0]&&m[1]===l[1])return;if(q.length<2)q.push(m)}
function tick(){if(q.length)dir=q.shift();const h=cells[0],n=[h[0]+dir[0],h[1]+dir[1]];
if(n[0]<0||n[1]<0||n[0]>=N||n[1]>=N||cells.some((c,i)=>i<cells.length-(grow>0?0:1)&&c[0]===n[0]&&c[1]===n[1])){over();return}
cells.unshift(n);if(grow>0)grow--;else cells.pop();
if(fruit&&n[0]===fruit.x&&n[1]===fruit.z){score+=fruit.pts;eaten++;grow+=2;const c=Math.max(1,fruit.pts/10|0);coinsRun+=c;burst(fruit.m.position,fruit.m.material.color.getHex());beep(fruit.pts>=100?880:520,.15,'triangle');toast('+'+fruit.pts+' '+fruit.name);tickMs=Math.max(75,150-eaten*3);sc.remove(fruit.m);fruit=null;spawn();hud()}else beep(90,.03,'square',.03);
sync()}
// input
addEventListener('keydown',e=>{const k={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'}[e.key];if(k&&state==='play'){turn(k);e.preventDefault()}if((e.key==='p'||e.key==='Escape')&&(state==='play'||state==='pause'))pz()});
document.querySelectorAll('#dp button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.d)}));
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(state!=='play'||tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));tx=null});
let md;addEventListener('mousedown',e=>md=[e.clientX,e.clientY]);addEventListener('mouseup',e=>{if(!md||state!=='play')return;const dx=e.clientX-md[0],dy=e.clientY-md[1];if(Math.max(Math.abs(dx),Math.abs(dy))>40)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));md=null});
function pz(){if(state==='play'){state='pause';show('pause')}else if(state==='pause'){state='play';show(null);t0=performance.now()}}
$('pb').onclick=pz;$('bRes').onclick=pz;$('bPlay').onclick=start;$('bAgain').onclick=start;
$('bQuit').onclick=$('bMenu').onclick=()=>{demo();show('menu')};
$('bCust').onclick=()=>{demo();show('cust')};$('bBack').onclick=()=>{save();show('menu')};
$('bMute').onclick=()=>{S.mute=!S.mute;$('bMute').textContent=S.mute?'🔇 SUARA: OFF':'🔊 SUARA: ON';save()};
$('bShare').onclick=async()=>{const t='Skor saya di 3D Snake Adventure: '+score+' 🐍';try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);toast('Disalin!')}}catch(e){}};
// customize UI
function buildUI(){const w=$('sws');w.innerHTML='';COLORS.forEach(c=>{const d=document.createElement('div');d.className='sw'+(S.color===c?' sel':'');d.style.background=c==='rainbow'?'linear-gradient(135deg,red,orange,yellow,green,cyan,blue,violet)':c;d.onclick=()=>{S.color=c;recolor();buildUI()};w.appendChild(d)});
const a=$('acc');a.innerHTML='';[['hat','🎉 Topi Ultah'],['crown','👑 Mahkota'],['glasses','🕶 Kacamata']].forEach(([k,l])=>{const b=document.createElement('button');b.className='tg'+(S.acc[k]?' on':'');b.textContent=l;b.onclick=()=>{S.acc[k]=!S.acc[k];applyAcc();buildUI()};a.appendChild(b)})}
$('bRnd').onclick=()=>{S.color=COLORS[Math.random()*COLORS.length|0];['hat','crown','glasses'].forEach(k=>S.acc[k]=Math.random()<.4);recolor();applyAcc();buildUI()};
$('bRst').onclick=()=>{S.color='#2ecc71';S.acc={hat:false,crown:false,glasses:true};recolor();applyAcc();buildUI()};
// loop
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),now=performance.now();
if(state==='play'){acc+=dt*1000;while(acc>=tickMs&&state==='play'){acc-=tickMs;tick()}}
// camera
if(state==='menu'){angle+=dt*.4;const cu=!$('cust').classList.contains('on');cam.position.set(Math.cos(angle)*(cu?9:7),cu?5:4,Math.sin(angle)*(cu?9:7));cam.lookAt(0,.8,0);const p=cell(10,10);cells.forEach((c,i)=>{c[0]=10-i;c[1]=10})}
else{const asp=innerWidth/innerHeight,d=asp<1?30:20;cam.position.set(0,d,asp<1?10:9);cam.lookAt(0,0,0)}
// snake smoothing
const k=1-Math.pow(.0005,dt*(1000/tickMs)/6);
segs.forEach((s,i)=>{const p=cells[i];if(!p)return;const tgt=cell(p[0],p[1]);if(state==='menu'){tgt.set((4-i)*.9-3.6,.5+Math.sin(now/300+i*.7)*.12,0)}s.position.lerp(tgt,state==='menu'?.2:Math.min(1,k*3));
if(i){const sk=(s.userData.k||.9);s.scale.setScalar(sk*(1+(state==='play'?0:.04*Math.sin(now/250+i))))}});
if(segs[0]){const h=segs[0],ty=-Math.atan2(dir[1],dir[0]);let df=ty-h.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));h.rotation.y+=df*Math.min(1,dt*14);
h.rotation.z=state==='over'?.6:0;h.scale.setScalar(1+(state==='menu'?.05*Math.sin(now/200):0));tongue.scale.x=.4+Math.abs(Math.sin(now/120));}
if(fruit){fruit.m.rotation.y+=dt*2;fruit.m.position.y=.55+Math.sin(now/300)*.12;if(fruit.exp&&now>fruit.exp)spawn()}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.userData.v.y-=12*dt;p.position.addScaledVector(p.userData.v,dt);p.userData.l-=dt;if(p.userData.l<=0){sc.remove(p);parts.splice(i,1)}}
R.render(sc,cam)}
buildUI();demo();$('bMute').textContent=S.mute?'🔇 SUARA: OFF':'🔊 SUARA: ON';show('menu');loop();
</script></body></html>
